{% extends "base.html" %}

{% block title %}Properties{% endblock %}

{% block main %}
<h1 class="display-5 fw-bold">Properties</h1>

<div id="properties" class="row row-cols-1 row-cols-md-3 g-4">
  {% for property in Properties %}
    <div class="col">
      <div class="card h-100 shadow-sm">
        <img src="{{ url_for('static', filename='uploads/' + property.photo) }}" class="card-img-top" alt="..." style="height: 200px; object-fit: cover;">
        <div class="card-body">
          <h5 class="card-title">{{ property.title }}</h5>
          <p class="card-text text-muted">
            <i class="bi bi-geo-alt"></i> {{ property.location }}
          </p>
          <span class="badge" style="background-color: #20c997;">{{ property.price }}</span>
        </div>
        <div class="card-footer p-0">
          <a href="{{ url_for('property', propertyid=property.id) }}" class="btn w-100" style="background-color: #20c997; color: white; border-radius: 0;">View Property</a>
        </div>
      </div>
    </div>
  {% endfor %}
</div>
{% endblock %}
